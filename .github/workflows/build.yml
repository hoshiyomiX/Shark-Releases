name: build

on:
  workflow_dispatch:
  push:
    branches: [main, x6873-support]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the exploit runners into jniLibs
        run: |
          ./exploit/build-all.sh
          ls -l app/app/src/main/jniLibs/arm64-v8a/

      - name: Build the APK (unsigned without keystore.properties)
        run: |
          cd app
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-apk-unsigned
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload runners
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-runners
          path: app/app/src/main/jniLibs/arm64-v8a/libk*.so
          if-no-files-found: error
