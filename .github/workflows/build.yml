name: build

on:
  workflow_dispatch:
  push:
    branches: [main, x6873-support]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the exploit runners into jniLibs
        run: |
          ./exploit/build-all.sh
          ls -l app/app/src/main/jniLibs/arm64-v8a/

      - name: Build the ghostlock (CVE-2026-43499) unlock engine into jniLibs
        run: |
          ./exploit/build-ghostlock.sh
          ls -l app/app/src/main/jniLibs/arm64-v8a/libghostlock.so

      - name: Create the dev keystore (signed, installable APK)
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -keystore app/keystore/shark-dev.jks \
            -alias sharkdev -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass sharkdev123 -keypass sharkdev123 \
            -dname "CN=Shark Dev, OU=Port, O=Shark-Releases, C=ID"
          printf 'storeFile=keystore/shark-dev.jks\nstorePassword=sharkdev123\nkeyAlias=sharkdev\nkeyPassword=sharkdev123\n' \
            > app/keystore.properties

      - name: Build the signed APK
        run: |
          cd app
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-apk
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload runners
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-runners
          path: app/app/src/main/jniLibs/arm64-v8a/libk*.so
          if-no-files-found: error
